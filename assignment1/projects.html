<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #CD7B3E;
    --ink: #241B12;
    --btn: #1C1712;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family:Georgia, 'Times New Roman', Times, serif;
  }

  .wrap{
    max-width: 1000px;
    margin: 0 auto;
    padding: 72px 32px 90px;
  }

  h1{
    font-size: 40px;
    font-weight: 700;
    margin: 0 0 40px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 48px 40px;
  }

  .card h2{
    font-size: 23px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 20px;
  }

  .btn{
    display: inline-block;
    background: var(--btn);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    padding: 11px 22px;
    border-radius: 999px;
  }

  .btn:hover{
    opacity: 0.85;
  }

  @media (max-width: 760px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 520px){
    .grid{ grid-template-columns: 1fr; }
    .wrap{ padding: 56px 24px 70px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Projects</h1>
    <div class="grid">
      <div class="card">
        <h2>Cinema Booking System</h2>
        <a class="btn" href="proj1.html">View project</a>
      </div>
      <div class="card">
        <h2>2-Player Fighter Jet Arcade Game</h2>
        <a class="btn" href="proj2.html">View project</a>
      </div>
      <div class="card">
        <h2>Topical Past Paper Annotater</h2>
        <a class="btn" href="proj3.html">View project</a>
      </div>
      <div class="card">
        <h2>DS Maze Game</h2>
        <a class="btn" href="proj4.html">View project</a>
      </div>
      <div class="card">
        <h2>EM Project</h2>
        <a class="btn" href="proj5.html">View project</a>
      </div>
    </div>
  </div>
</body>
</html>
