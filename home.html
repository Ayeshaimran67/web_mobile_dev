<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #CD7B3E;
    --ink: #241B12;
    --ink-soft: #4A3B29;
    --panel: #F3E9DC;
    --tag-bg: #1C1712;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 32px 100px;
  }

  header{
    margin-bottom: 56px;
  }

  .eyebrow{
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  h1{
    font-size: 40px;
    font-weight: 700;
    margin: 0 0 14px;
  }

  .contact{
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.7;
  }

  section{
    margin-bottom: 44px;
  }

  h2{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(36, 27, 18, 0.18);
  }

  p.line{
    font-size: 15.5px;
    margin: 0 0 6px;
    line-height: 1.6;
  }

  .tags{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .tag{
    background: var(--tag-bg);
    color: #fff;
    font-size: 13.5px;
    padding: 8px 16px;
    border-radius: 999px;
  }

  ul.plain{
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul.plain li{
    font-size: 15.5px;
    line-height: 1.7;
    padding-left: 18px;
    position: relative;
  }

  ul.plain li::before{
    content: '—';
    position: absolute;
    left: 0;
    color: var(--ink-soft);
  }

  @media (max-width: 480px){
    .wrap{ padding: 60px 22px 80px; }
    h1{ font-size: 32px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Portfolio</p>
      <h1>Ayesha Imran</h1>
      <div class="contact">
        ai09884@habib.edu.pk<br>
        Majoring in CS at Habib University
      </div>
    </header>

    <section>
      <h2>Skills</h2>
      <div class="tags">
        <span class="tag">C++</span>
        <span class="tag">Python</span>
        <span class="tag">SQL</span>
        <span class="tag">MongoDB</span>
        <span class="tag">Microsoft Office</span>
        <span class="tag">Team Collaboration</span>
      </div>
    </section>

    <section>
      <h2>Hobbies</h2>
      <ul class="plain">
        <li>Reading books</li>
        <li>Baking</li>
        <li>Watching movies and shows</li>
        <li>Crafting</li>
      </ul>
    </section>
  </div>
</body>
</html>
