
<!DOCTYPE html>
<html lang="en">
<head>
    <title>JavaScript Control Structures</title>
</head>
<body>
    <h1>JavaScript Control Structures</h1>
    <div>
        <h2>1. if / else</h2>
        <script>
            let age = 20;
            let grade = "A"
            if (age >= 20 && grade == "A") {
                document.write("<p>You passed.</p>");
            } else {
                document.write("<p>You didnot pass.</p>");
            }
        </script>
    </div>

    <div>
        <h2>2. switch</h2>
        <script>
            let day = 3;
            let dayName;

            switch (day) {
                case 1:
                    dayName = "Monday";
                    break;
                case 2:
                    dayName = "Tuesday";
                    break;
                case 3:
                    dayName = "Wednesday";
                    break;
                default:
                    dayName = "Another day";
            }

            document.write("<p>Day " + day + " is " + dayName + ".</p>");
        </script>
    </div>

    <div>
        <h2>3. for loop</h2>
        <script>
            document.write("<p>Numbers from 1 to 5: ");
            for (let i = 1; i <= 5; i++) {
                document.write(i + " ");
            }
            document.write("</p>");
        </script>
    </div>

    <div>
        <h2>4. while loop</h2>
        <script>
            let count = 1;
            document.write("<p>");
            while (count <= 5) {
                document.write(count + " ");
                count++;
            }
            document.write("</p>");
        </script>
    </div>

    <div>
        <h2>5. break</h2>
        <script>
            document.write("<p>");
            for (let i = 1; i <= 10; i++) {
                if (i === 6) {
                    break;
                }
                document.write(i + " ");
            }
            document.write("</p>");
        </script>
    </div>

    <div>
        <h2>6. continue</h2>
        <script>
            document.write("<p>");
            for (let i = 1; i <= 6; i++) {
                if (i === 3) {
                    continue;
                }
                document.write(i + " ");
            }
            document.write("</p>");
        </script>
    </div>
    <div>
        <h2>7. practice</h2>
        <script>
            let Class = 370;
            let class_name;
            switch(Class) {
                case 370:
                    class_name = "web and mobile dev";
                    break;
                default :
                 class_name = "other class";
            }
            document.write("<p>" + Class + " is " + class_name+ ".</p>")
        </script>
    </div>
    <div>
        <h2>3. for loop</h2>
        <script>
            document.write("<p>Table of 2: <br>");
            for (let i = 1; i <= 10; i++) {
                document.write("2 * " + i+ " = "+ (i*2) + "<br>");
            }
            document.write("</p>");
        </script>
    </div>
    <div>
        <h2>practice loop</h2>
        <script>
            let students = ["Ayesha", "Adina","Lamia", "Emaan"];
            for (const stud of students){
                document.write("<p>"+ stud + "</p>");
            }
        </script>
    </div>
</body>

</html>
